<!-- VERSION C32 – Reverse Calculator -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jio Retailer – Reverse Earning Calculator</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --deepBlue:#002d62;
      --btnBlue1:#005eff;
      --btnBlue2:#003bba;

      --text:#202124;
      --sub:#5f6368;
      --border:#dadce0;
      --bg:#ffffff;
      --inputBg:#f8f9fa;

      --shadow: 0 1px 2px rgba(0,0,0,0.10);
      --tabH: 68px;
    }

    *{
      box-sizing:border-box;
      font-family:Inter,sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
    }

    .page{
      max-width:820px;
      margin:0 auto;
      padding:16px 14px;
      padding-bottom:calc(var(--tabH) + 20px);
    }

    /* ===== Header ===== */
    .title{
      text-align:center;
      font-size:26px;
      font-weight:900;
      color:var(--deepBlue);
      letter-spacing:-0.6px;
    }

    .subtitle{
      margin-top:6px;
      text-align:center;
      font-size:13px;
      font-weight:500;
      color:var(--sub);
    }

    .divider{
      border:none;
      border-top:1px solid #eef0f3;
      margin:14px 0;
    }

    /* ===== Target Card ===== */
    .target-card{
      background:#f7fafc;
      border:1px solid #eef2f6;
      border-radius:18px;
      padding:18px 14px;
      text-align:center;
    }

    .target-label{
      font-size:12px;
      font-weight:700;
      letter-spacing:1.6px;
      text-transform:uppercase;
      color:#94a3b8;
    }

    .target-input{
      margin-top:10px;
      width:100%;
      max-width:220px;
      height:56px;
      border-radius:16px;
      border:1px solid var(--border);
      background:var(--inputBg);
      font-size:32px;
      font-weight:900;
      text-align:center;
      outline:none;
      color:var(--deepBlue);
    }

    .target-input:focus{
      border-color:var(--btnBlue1);
      box-shadow:0 0 0 4px rgba(0,94,255,0.12);
      background:#fff;
    }

    .hint{
      margin-top:10px;
      font-size:12px;
      color:var(--sub);
      line-height:1.4;
    }

    /* ===== Result ===== */
    .result{
      margin-top:18px;
      display:none;
    }

    .result-card{
      background:linear-gradient(90deg,var(--btnBlue1),var(--btnBlue2));
      border-radius:18px;
      padding:18px 14px;
      color:#fff;
      text-align:center;
    }

    .result-label{
      font-size:12px;
      font-weight:700;
      letter-spacing:1.5px;
      text-transform:uppercase;
      opacity:.9;
    }

    .result-value{
      margin-top:8px;
      font-size:30px;
      font-weight:900;
      letter-spacing:-0.6px;
    }

    /* ===== Footer note ===== */
    .note{
      margin-top:14px;
      font-size:12px;
      color:var(--sub);
      line-height:1.4;
      text-align:center;
    }

    /* ===== Bottom Tabs ===== */
    .bottom-tabs{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:0;
      width:100%;
      max-width:820px;
      height:var(--tabH);
      background:rgba(255,255,255,0.96);
      border-top:1px solid #eef0f3;
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      z-index:999;
      backdrop-filter:blur(8px);
    }

    .tab-btn{
      border:none;
      background:none;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      font-weight:900;
      font-size:11px;
      color:#6b7280;
      cursor:pointer;
    }

    .tab-btn.active{
      color:var(--deepBlue);
    }

    .tab-ic{
      width:22px;
      height:22px;
      stroke:currentColor;
      fill:none;
      stroke-width:2;
    }
  </style>
</head>

<body>

<div class="page">
  <h1 class="title">Reverse Earning</h1>
  <div class="subtitle">Plan your sales based on goal amount</div>

  <hr class="divider">

  <div class="target-card">
    <div class="target-label">Target Payout (₹)</div>
    <input class="target-input" id="targetAmount" type="number" min="0" placeholder="0">
    <div class="hint">
      Enter the payout you want to achieve.  
      This will help you plan required sales.
    </div>
  </div>

  <div class="result" id="resultBox">
    <div class="result-card">
      <div class="result-label">Required MNP Activations (Approx.)</div>
      <div class="result-value" id="requiredMnp">0</div>
    </div>
  </div>

  <div class="note">
    *Calculation is indicative. Final payout will depend on actual mix and company system.
  </div>
</div>

<!-- ===== Bottom Tabs ===== -->
<div class="bottom-tabs">
  <button class="tab-btn" onclick="location.href='index.html'">
    <svg class="tab-ic" viewBox="0 0 24 24">
      <rect x="4" y="3" width="16" height="18" rx="3"></rect>
      <line x1="8" y1="8" x2="16" y2="8"></line>
      <line x1="8" y1="12" x2="16" y2="12"></line>
      <line x1="8" y1="16" x2="16" y2="16"></line>
    </svg>
    Calculator
  </button>

  <button class="tab-btn" onclick="location.href='training.html'">
    <svg class="tab-ic" viewBox="0 0 24 24">
      <path d="M4 19V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v13"></path>
      <path d="M6 4v16"></path>
    </svg>
    Training
  </button>

  <button class="tab-btn active">
    <svg class="tab-ic" viewBox="0 0 24 24">
      <path d="M3 12a9 9 0 0 1 15-6"></path>
      <polyline points="18 3 18 7 14 7"></polyline>
      <path d="M21 12a9 9 0 0 1-15 6"></path>
      <polyline points="6 21 6 17 10 17"></polyline>
    </svg>
    Reverse
  </button>
</div>

<script>
  const input = document.getElementById("targetAmount");
  const resultBox = document.getElementById("resultBox");
  const resultVal = document.getElementById("requiredMnp");

  input.addEventListener("input", () => {
    const target = parseInt(input.value) || 0;

    if (target <= 0) {
      resultBox.style.display = "none";
      return;
    }

    // Approx logic: avg ₹234 per MNP (same as calculator)
    const mnpRequired = Math.ceil(target / 234);

    resultVal.innerText = mnpRequired;
    resultBox.style.display = "block";
  });
</script>

</body>
</html>
