<!-- TRAINING HUB - VERSION T1 (Works with C32 Quick Switcher) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jio Retailer - Training Hub</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9GH8905Y6B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-9GH8905Y6B');
  </script>

  <style>
    :root{
      --deepBlue:#002d62;
      --btnBlue1:#005eff;
      --btnBlue2:#003bba;

      --text:#202124;
      --sub:#5f6368;
      --border:#dadce0;
      --bg:#ffffff;
      --danger:#d93025;

      --cardBg:#f7fafc;
      --cardBorder:#eef2f6;

      --tagRedBg:#ffe9e9;
      --tagRedText:#d93025;

      --tagBlueBg:#e8f0fe;
      --tagBlueText:#0b57d0;

      --shadow: 0 1px 2px rgba(0,0,0,0.10);
    }

    *{
      box-sizing: border-box;
      font-family: Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body{
      margin: 0;
      background: var(--bg);
      color: var(--text);
      overflow-y: auto;
    }

    .page{
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 14px 14px 18px;
    }

    /* ===== Header ===== */
    .header{ padding: 10px 0 8px; }

    .title{
      margin: 0;
      font-size: 30px;
      font-weight: 900;
      color: var(--deepBlue);
      letter-spacing: -0.8px;
      line-height: 1.1;
    }

    .subtitle{
      margin: 6px 0 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--sub);
      line-height: 1.3;
    }

    /* ✅ Quick Switcher */
    .quick-switcher{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
      margin: 14px 0 14px;
    }

    .switch-btn{
      height: 44px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #4b5563;
      cursor: pointer;
    }

    .switch-btn:active{
      transform: scale(0.99);
    }

    .block-divider{
      border-bottom: 1px solid #eef0f3;
      margin: 8px 0 0;
    }

    /* ===== Cards ===== */
    .list{
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card{
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--cardBg);
      border: 1px solid var(--cardBorder);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .card:active{
      transform: scale(0.99);
    }

    .thumb{
      width: 92px;
      height: 58px;
      border-radius: 14px;
      background: #dbeafe;
      position: relative;
      flex: 0 0 auto;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Video play button overlay */
    .play{
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play:before{
      content:"";
      border-style: solid;
      border-width: 7px 0 7px 12px;
      border-color: transparent transparent transparent #ffffff;
      margin-left: 2px;
    }

    .pdfIcon{
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: rgba(11,87,208,0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #0b57d0;
      font-size: 14px;
    }

    .info{
      flex: 1;
      min-width: 0;
    }

    .tag{
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      margin-bottom: 6px;
      white-space: nowrap;
    }

    .tag.video{
      background: var(--tagRedBg);
      color: var(--tagRedText);
    }

    .tag.doc{
      background: var(--tagBlueBg);
      color: var(--tagBlueText);
    }

    .card-title{
      font-size: 16px;
      font-weight: 900;
      color: var(--deepBlue);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta{
      margin-top: 3px;
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }

    .footer-note{
      margin-top: 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--sub);
      line-height: 1.35;
    }

    @media (max-width: 420px){
      .title{ font-size: 28px; }
      .thumb{ width: 86px; height: 56px; }
      .card-title{ font-size: 15px; }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="header">
      <h1 class="title">Training Hub</h1>
      <div class="subtitle">Video guides & process documents</div>
    </div>

    <!-- ✅ Quick Switcher for Training page -->
    <div class="quick-switcher">
      <button class="switch-btn" onclick="location.href='index.html'">Open Calculator</button>
      <button class="switch-btn" onclick="location.href='reverse.html'">Open Reverse Calc</button>
    </div>

    <div class="block-divider"></div>

    <div class="list">

      <!-- ===== Video Card ===== -->
      <div class="card" onclick="openVideo()">
        <div class="thumb">
          <div class="play"></div>
        </div>

        <div class="info">
          <div class="tag video">Video Guide</div>
          <div class="card-title">Mastering MNP Process</div>
          <div class="meta">Duration: 4:30 Mins</div>
        </div>
      </div>

      <!-- ===== PDF Card ===== -->
      <div class="card" onclick="openPdf()">
        <div class="thumb" style="background:#eaf2ff;">
          <div class="pdfIcon">PDF</div>
        </div>

        <div class="info">
          <div class="tag doc">Document (PDF)</div>
          <div class="card-title">Latest Scheme PDF (Jan 24)</div>
          <div class="meta">Size: 1.2 MB</div>
        </div>
      </div>

    </div>

    <div class="footer-note">
      *Use this hub to quickly access MNP training videos and latest process documents.
    </div>

  </div>

<script>
  function openVideo(){
    if (typeof gtag === "function") {
      gtag('event', 'training_video_opened', {
        event_category: 'TrainingHub',
        event_label: 'Mastering MNP Process'
      });
    }

    // ✅ Replace with your actual YouTube/Drive link
    alert("Add your Training Video link here (YouTube / Drive).");
  }

  function openPdf(){
    if (typeof gtag === "function") {
      gtag('event', 'training_pdf_opened', {
        event_category: 'TrainingHub',
        event_label: 'Latest Scheme PDF (Jan 24)'
      });
    }

    // ✅ Replace with your actual PDF link
    alert("Add your PDF link here (Drive / hosted file).");
  }
</script>

</body>
</html>
