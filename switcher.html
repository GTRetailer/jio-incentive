<!-- switcher.html | Bottom Tab Switch (Earning / Learn / Goal) | Matches Index.html typography + colors -->
<style>
  :root{
    --deepBlue:#002d62;
    --btnBlue1:#005eff;
    --btnBlue2:#003bba;

    --text:#202124;
    --sub:#5f6368;
    --border:#dadce0;
    --bg:#ffffff;

    --shadow: 0 1px 2px rgba(0,0,0,0.10);
    --tabH: 72px;

    --pillBg: rgba(0, 45, 98, 0.10);
    --pillBorder: rgba(0, 45, 98, 0.16);
  }

  /* ✅ Prevent page content hidden behind fixed bottom tabs */
  body{
    padding-bottom: calc(var(--tabH) + 10px);
  }

  .bottom-tabs{
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 0;

    width: 100%;
    max-width: 820px;
    height: var(--tabH);

    background: rgba(255,255,255,0.98);
    border-top: 1px solid #eef0f3;
    z-index: 9999;

    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: center;

    padding: 8px 10px 10px;
    backdrop-filter: blur(10px);
  }

  .tab-btn{
    border: none;
    background: transparent;
    cursor: pointer;
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ✅ WhatsApp-like rounded rectangle background for active */
  .tab-inner{
    width: 100%;
    max-width: 150px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;

    padding: 9px 8px;
    border-radius: 18px;

    color: #6b7280;
    font-weight: 900;

    transition: all 160ms ease;
    box-shadow: none;
  }

  /* ✅ Active = Premium pill highlight */
  .tab-btn.active .tab-inner{
    background: var(--pillBg);
    border: 1px solid var(--pillBorder);
    color: var(--deepBlue);
    box-shadow: 0 10px 22px rgba(0,45,98,0.08);
  }

  .tab-ic{
    width: 22px;
    height: 22px;
    display: block;
    stroke: currentColor;
  }

  .tab-label{
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 0.2px;
    color: inherit; /* ✅ follows active/inactive state */
  }

  /* ✅ Tap feedback */
  .tab-btn:active .tab-inner{
    transform: scale(0.98);
  }

  /* ✅ Optional hover (desktop) */
  @media (hover: hover){
    .tab-btn:hover .tab-inner{
      border: 1px solid rgba(0,0,0,0.06);
      background: rgba(0,0,0,0.02);
    }
    .tab-btn.active:hover .tab-inner{
      background: var(--pillBg);
      border: 1px solid var(--pillBorder);
    }
  }
</style>

<div class="bottom-tabs" id="bottomTabs">
  <!-- Earning (Wallet) -->
  <button class="tab-btn" data-tab="calculator" onclick="location.href='index.html'" aria-label="Earning">
    <div class="tab-inner">
      <svg viewBox="0 0 24 24" class="tab-ic" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 7H6a3 3 0 0 0-3 3v7a3 3 0 0 0 3 3h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z"></path>
        <path d="M16 3H6a3 3 0 0 0-3 3"></path>
        <path d="M17 13h.01"></path>
      </svg>
      <div class="tab-label">Earning</div>
    </div>
  </button>

  <!-- Learn (Play Circle) -->
  <button class="tab-btn" data-tab="training" onclick="location.href='training.html'" aria-label="Learn">
    <div class="tab-inner">
      <svg viewBox="0 0 24 24" class="tab-ic" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M10 8l6 4-6 4V8z"></path>
      </svg>
      <div class="tab-label">Learn</div>
    </div>
  </button>

  <!-- Goal (Bullseye) -->
  <button class="tab-btn" data-tab="reverse" onclick="location.href='reverse.html'" aria-label="Goal">
    <div class="tab-inner">
      <svg viewBox="0 0 24 24" class="tab-ic" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <circle cx="12" cy="12" r="6"></circle>
        <circle cx="12" cy="12" r="2"></circle>
      </svg>
      <div class="tab-label">Goal</div>
    </div>
  </button>
</div>

<script>
  // ✅ Auto-highlight active tab by current page
  (function setActiveTab(){
    const path = window.location.pathname.toLowerCase();
    let active = "calculator";

    if (path.includes("training.html")) active = "training";
    else if (path.includes("reverse.html")) active = "reverse";
    else active = "calculator";

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.tab === active);
    });
  })();
</script>
