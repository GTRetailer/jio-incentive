<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jiolite - Incentive Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #f8f9fa;
      margin: 20px;
      font-size: 14px;
    }
    h2 {
      text-align: center;
      color: #0b57d0;
      font-size: 20px;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    label {
      font-weight: 500;
    }
    input[type="number"] {
      width: 100px;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
      text-align: right;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .result {
      margin-top: 15px;
      font-weight: bold;
      font-size: 16px;
      text-align: center;
    }
    #languageSelector {
      float: right;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <select id="languageSelector" onchange="changeLanguage(this.value)">
    <option value="en">English</option>
    <option value="hi">हिन्दी</option>
  </select>

  <h2 id="title">Jiolite - Incentive Calculator</h2>

  <div class="row">
    <label id="labelMnp349" for="mnp349">MNP ₹349</label>
    <input type="number" id="mnp349" min="0" />
  </div>

  <div class="row">
    <label id="labelRecharge349" for="recharge349">Recharge ₹349</label>
    <input type="number" id="recharge349" min="0" />
  </div>

  <button onclick="calculate()" id="calculateBtn">Calculate</button>
  <div class="result" id="resultBox">Total Incentive: ₹0</div>
</div>

<script>
let translations = {};

async function loadLanguageFile() {
  const res = await fetch('translations.json');
  translations = await res.json();
  const currentLang = document.getElementById('languageSelector').value || 'en';
  changeLanguage(currentLang);
}

function changeLanguage(lang) {
  const t = translations[lang];
  if (!t) return;

  document.getElementById("title").innerText = t.title;
  document.getElementById("labelMnp349").innerText = t.mnp349;
  document.getElementById("labelRecharge349").innerText = t.recharge349;
  document.getElementById("calculateBtn").innerText = t.calculate;
  document.getElementById("resultBox").innerText = t.result + ": ₹0";
}

function calculate() {
  const mnp = parseInt(document.getElementById("mnp349").value) || 0;
  const recharge = parseInt(document.getElementById("recharge349").value) || 0;
  const total = mnp + recharge;

  let bonus = 0;
  if (total >= 10 && total <= 49) {
    bonus = total * 10;
  } else if (total >= 50) {
    bonus = 1000;
  }

  document.getElementById("resultBox").innerText = `Total Incentive: ₹${bonus}`;
}

loadLanguageFile();
</script>
</body>
</html>
